<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Generador de diagramas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: mesa de trabajo en dos mitades. A la izquierda se escriben los pasos
   en tarjetas, a la derecha una hoja blanca donde el diagrama se dibuja solo. */
:root {
  --bg: #F2F6F6;
  --surface: #FFFFFF;
  --surface-2: #E8EFEF;
  --fg: #14262B;
  --muted: #566B70;
  --line: #D2DDDE;
  --accent: #0F766E;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCF0ED;
  --amber: #B45309;
  --amber-soft: #FDF1D2;
  --danger: #B42318;
  --danger-soft: #FDE7E4;
  --focus: #0F766E;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A1D; --surface: #14262B; --surface-2: #1B3238; --fg: #E5F0F0; --muted: #94ABAF;
    --line: #28434A; --accent: #2DD4BF; --accent-ink: #052825; --accent-soft: #15383A;
    --amber: #F5B551; --amber-soft: #3A2E14; --danger: #FF8A7B; --danger-soft: #3B1D1A; --focus: #2DD4BF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A1D; --surface: #14262B; --surface-2: #1B3238; --fg: #E5F0F0; --muted: #94ABAF;
  --line: #28434A; --accent: #2DD4BF; --accent-ink: #052825; --accent-soft: #15383A;
  --amber: #F5B551; --amber-soft: #3A2E14; --danger: #FF8A7B; --danger-soft: #3B1D1A; --focus: #2DD4BF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-inline: 16px; padding-block: 16px 40px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { max-width: 1360px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

/* ---------- barra superior ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.55rem; letter-spacing: -0.01em; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; text-wrap: balance; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 0.9rem;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { padding: 6px 10px; font-size: 0.82rem; border-radius: 8px; }
.btn.warn-state { border-color: var(--danger); color: var(--danger); }
.sep { width: 1px; background: var(--line); align-self: stretch; margin-inline: 2px; }

/* ---------- pestañas (solo celular) ---------- */
.tabs { display: none; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.badge[hidden] { display: none; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 0.75rem; line-height: 20px; }

/* ---------- dos paneles ---------- */
.work { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
.panel-title h2 { font-family: var(--display); font-weight: 600; font-size: 1.1rem; margin: 0; }
.panel-title span { color: var(--muted); font-size: 0.82rem; }

/* ---------- tarjetas de pasos ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card:focus-within { border-color: var(--accent); }
.card-head { display: flex; align-items: center; gap: 8px; }
.num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.ico { flex: none; width: 34px; height: 24px; }
.type { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
.tools { display: flex; gap: 2px; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.del:hover { background: var(--danger-soft); color: var(--danger); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.txt { width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
.txt::placeholder { color: var(--muted); opacity: .8; }
.conn { display: flex; flex-direction: column; gap: 6px; }
.conn label, .conn .lbl { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.row { display: flex; gap: 6px; align-items: center; }
.row select, .row input { min-width: 0; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.row select { flex: 1; }
.row .ex-label { width: 38%; flex: none; font-weight: 600; }
.row .arrow { color: var(--muted); flex: none; }
.row.miss select { border-color: var(--danger); background: var(--danger-soft); }
.icon-slot:empty { display: none; }
.icon-row { display: flex; gap: 8px; align-items: center; }
.icon-prev { flex: none; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: #FFFFFF; display: grid; place-items: center; color: #8A9BA0; }
.icon-sel { flex: 1; min-width: 0; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 0.88rem; }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
.add-exit { align-self: flex-start; }
.add-step { margin-top: 10px; width: 100%; justify-content: center; border-style: dashed; padding: 12px; }

.review { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.review h3 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.review button { text-align: left; border: 1px solid var(--line); background: var(--amber-soft); border-radius: 9px; padding: 8px 10px; font-size: 0.86rem; }
.review button:hover { border-color: var(--amber); }
.review .ok { color: var(--accent); font-weight: 600; font-size: 0.9rem; }

/* ---------- hoja del diagrama ---------- */
.stage { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tools-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tools-bar .grow { flex: 1; }
.wrap-sel select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 0.82rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.zoom-val { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }
.paper { background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; overflow: auto; max-height: calc(100vh - 150px); min-height: 280px; padding: 8px; }
.paper svg { display: block; margin-inline: auto; }
.empty { display: grid; place-items: center; min-height: 260px; color: #566B70; text-align: center; padding: 24px; }
details.legend { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
details.legend summary { cursor: pointer; font-weight: 600; }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; margin-top: 10px; }
.legend-item { display: flex; gap: 10px; align-items: center; font-size: 0.86rem; color: var(--muted); }
.legend-item b { display: block; color: var(--fg); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; z-index: 30; width: max-content; max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; background: rgba(8, 20, 22, .6); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { background: var(--surface); border-radius: 16px; padding: 16px; max-width: min(720px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.modal img { max-width: 100%; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
.modal p { margin: 0; color: var(--muted); }

@media (max-width: 920px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .tabs { display: flex; }
  .work[data-view="steps"] .stage { display: none; }
  .work[data-view="diagram"] .editor { display: none; }
  .stage { position: static; }
  .paper { max-height: none; }
  h1 { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="1" y="1" width="42" height="42" rx="11" fill="#0F766E"/>
        <rect x="14" y="7" width="16" height="7" rx="3.5" fill="#fff"/>
        <path d="M22 14v4" stroke="#fff" stroke-width="2"/>
        <path d="M22 18l8 5-8 5-8-5z" fill="#FDE9B0"/>
        <path d="M22 28v4M30 23h3v9" stroke="#fff" stroke-width="2" fill="none"/>
        <rect x="14" y="32" width="16" height="6" rx="1.5" fill="#fff"/>
      </svg>
      <div>
        <h1>Generador de diagramas</h1>
        <p class="sub">Escribe tus pasos, elige a dónde va cada uno y el diagrama se dibuja solo.</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-example" type="button">Ver ejemplo</button>
      <button class="btn" id="btn-clear" type="button">Empezar de cero</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn primary" id="btn-png" type="button">Descargar imagen PNG</button>
      <button class="btn" id="btn-svg" type="button">Descargar SVG</button>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Vista">
    <button type="button" role="tab" id="tab-steps" aria-selected="true">1 · Tus pasos <span class="badge" id="tab-badge" hidden>0</span></button>
    <button type="button" role="tab" id="tab-diagram" aria-selected="false">2 · Tu diagrama</button>
  </div>

  <main class="work" id="work" data-view="steps">
    <section class="editor" aria-labelledby="h-steps">
      <div class="panel-title"><h2 id="h-steps">Tus pasos</h2><span id="count"></span></div>
      <ol class="steps" id="steps"></ol>
      <button class="btn add-step" id="btn-add" type="button">+ Agregar paso</button>
      <div class="review" id="review" aria-live="polite"></div>
    </section>

    <section class="stage" aria-labelledby="h-diagram">
      <div class="panel-title"><h2 id="h-diagram">Tu diagrama</h2><span id="banner"></span></div>
      <div class="tools-bar">
        <button class="btn sm" id="z-out" type="button" aria-label="Alejar">−</button>
        <span class="zoom-val" id="z-val">100%</span>
        <button class="btn sm" id="z-in" type="button" aria-label="Acercar">+</button>
        <button class="btn sm" id="z-fit" type="button">Ajustar a la hoja</button>
        <label class="wrap-sel"><span class="vh">Acomodo</span><select id="wrap-mode" aria-label="Acomodo del diagrama"><option value="auto">En columnas si es largo</option><option value="one">Una sola columna</option></select></label>
      </div>
      <div class="paper" id="paper"></div>
      <details class="legend">
        <summary>Qué significa cada forma</summary>
        <div class="legend-grid" id="legend"></div>
      </details>
    </section>
  </main>
</div>
<div id="layer"></div>

<script>

  dec: { label: 'Decisión', help: 'Una pregunta con dos o más salidas (Sí, No, Depende de…).' },
  io:  { label: 'Entrada / Salida', help: 'Datos que entran o resultados que salen.' },
  doc: { label: 'Documento', help: 'Un registro o reporte: bitácora, etiqueta.' },

  }
  function fallbackModal(blob, text) {
    var layer = $('#layer'), url = blob ? URL.createObjectURL(blob) : '';
    layer.innerHTML = '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-label="Guardar imagen"><p>' + text + '</p>' + (url ? '<img src="' + url + '" alt="Tu diagrama de flujo">' : '') +
      '<button class="btn primary" type="button" id="ov-close">Cerrar</button></div></div>';
    $('#ov-close').addEventListener('click', function () { layer.innerHTML = ''; });
  }
  var dlP = null;
  function getDownloads() { if (!dlP) dlP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(function () { return null; }) : Promise.resolve(null); return dlP; }
  function save2(filename, data, label) {
    getDownloads().then(function (dl) {
      if (!dl) {
        try {
          var bl = data instanceof Blob ? data : new Blob([data], { type: 'image/svg+xml' });
          var u = URL.createObjectURL(bl), a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(u); }, 4000); toast(label + ' descargado.');
          if (/iPhone|iPad|iPod/.test(navigator.userAgent)) fallbackModal(bl instanceof Blob && bl.type === 'image/png' ? bl : null, 'Si no se descargó, mantén presionada la imagen y elige «Guardar imagen».');
          return;
        } catch (e) {}
        fallbackModal(data instanceof Blob ? data : null, 'En esta vista no se pueden guardar archivos directamente. Mantén presionada la imagen (o haz clic derecho) y elige «Guardar imagen».'); return; }
      dl.save({ filename: filename, data: data }).then(function () { toast(label + ' guardado.'); }, function (err) {
        if (err && err.code === 'declined') return;
        toast('No se pudo guardar el archivo (' + ((err && err.code) || 'error') + ').');
      });
    });
  }
  $('#btn-png').addEventListener('click', function () {
    if (!steps.length) return;
    toPNG(function (b) { if (!b) { toast('No se pudo crear la imagen.'); return; } save2('diagrama-de-flujo.png', b, 'La imagen'); });
  });
  $('#btn-svg').addEventListener('click', function () { if (steps.length) save2('diagrama-de-flujo.svg', exportSVG(), 'El SVG'); });

  /* ---------- leyenda e inicio ---------- */
  $('#legend').innerHTML = TYPE_ORDER.map(function (t) { return '<div class="legend-item">' + icon(t) + '<div><b>' + TYPES[t].label + '</b>' + TYPES[t].help + '</div></div>'; }).join('');
  load(); renderCards(); renderDiagram();
  $('#banner').textContent = '';
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (fit) drawSVG(); });
})();
</script>
